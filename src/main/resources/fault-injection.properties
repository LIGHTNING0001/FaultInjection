# Required: target class and behavior(method) for injection
# Use full class name. Example: com.example.service.OrderServiceImpl
target.class=com.example.service.DemoService
# Use * for all methods
target.behavior=*

# Timeout injection
inject.timeout.enabled=true
inject.timeout.millis=1000

# Exception injection
inject.exception.enabled=false
inject.exception.class=java.lang.RuntimeException
inject.exception.message=fault injected by team tool

# Return value injection
inject.return.enabled=false
inject.return.type=string
inject.return.value=fault injected return value

# Probability control: 0-100, default 100
inject.probability.percent=100

# Max trigger count: -1 means unlimited
inject.max.trigger.count=-1
